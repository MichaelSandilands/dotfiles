# Remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Enable system clipboard integration via OSC 52 (supported natively by Kitty)
set -g set-clipboard on

# Optional: Enable mouse selection to copy straight to clipboard
set -g mouse on

# Use vi keys in copy-mode (Ctrl-a + [) and yank to system clipboard with 'y'
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Move status bar to the top
set-option -g status-position top

# Modern terminal & true-color settings (Kitty-compatible)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-kitty:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # Undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # Colored undercurls

# Sensible defaults (replacing tmux-sensible)
set -s escape-time 0
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g focus-events on
setw -g aggressive-resize on

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'Morantron/tmux-fingers'

# Plugin configuration
set -g @resurrect-strategy-nvim 'session'   # Restore Neovim sessions
set -g @continuum-restore 'on'              # Auto-restore on tmux start
set -g @fingers-key F                       # Trigger hints with Ctrl-a + F

# Theme
set -g @plugin 'TanglingTreats/tmux-everforest'
set -g @tmux-everforest 'dark-hard'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
